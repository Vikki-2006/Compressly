<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    path {
      fill: #111827;
      stroke: none;
      transition: fill 0.3s ease;
    }
    .curve-stroke {
      fill: none;
      stroke: #111827;
      stroke-width: 18;
      stroke-linecap: round;
      transition: stroke 0.3s ease;
    }
    @media (prefers-color-scheme: dark) {
      path {
        fill: #FFFFFF;
      }
      .curve-stroke {
        stroke: #FFFFFF;
      }
    }
  </style>
  <!-- Left inward arrow (pointing right) -->
  <path d="M44 216 H180 L120 110 L220 256 L120 402 L180 296 H44 Z" />
  <!-- Right inward arrow (pointing left) -->
  <path d="M468 216 H332 L392 110 L292 256 L392 402 L332 296 H468 Z" />
  <!-- Left center curve bowing left -->
  <path class="curve-stroke" d="M242 190 Q226 256 242 322" />
  <!-- Right center curve bowing right -->
  <path class="curve-stroke" d="M270 190 Q286 256 270 322" />
</svg>